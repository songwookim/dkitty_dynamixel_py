# config.yaml
# Dynamixel servo configuration for D'Kitty robot
# Reference: https://emanual.robotis.com/docs/en/dxl/x/xh430-w350/

dynamixel:
  # Servo IDs (D'Kitty: 3 legs x 3 joints = 9 servos)
  ids: [10, 11, 12, 20, 21, 22, 30, 31, 32]

  # Communication settings
  device_name: "/dev/ttyUSB0"
  baudrate: 1000000
  protocol_version: 2.0

  # Torque enable/disable values
  torque_enable: 1
  torque_disable: 0
  moving_status_threshold: 20

  # Operating modes
  # Reference: https://emanual.robotis.com/docs/en/dxl/x/xh430-w350/#operating-mode
  control_modes:
    current_control_mode: 0
    velocity_control_mode: 1
    position_control_mode: 3
    extended_position_control_mode: 4
    current_based_position_control_mode: 5
    pwm_control_mode: 16
    default_mode: 0  # 0: current, 3: position

  # Control table addresses (X/MX series - see Dynamixel Wizard 2.0)
  control_table:
    addr_torque_enable: 64
    addr_operating_mode: 11
    addr_baudrate: 8
    addr_delaytime: 9
    ADDR_GOAL_CURRENT: 102
    ADDR_GOAL_POSITION: 116
    ADDR_PRESENT_VELOCITY: 128
    ADDR_PRESENT_POSITION: 132

  # Position limits (raw value)
  position:
    min_position: 0
    max_position: 4095

  # Current (torque) limits
  current:
    max_current: 10  # max: 2047
